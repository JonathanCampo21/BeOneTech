<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Be One Tech - Dashboard Liderança</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <h1>Painel da <span class="highlight">Liderança</span></h1>
        <button onclick="window.location.href='index.html'" style="background: #333; color: white;">Ver Sugestões</button>
    </header>

    <div class="card">
        <h2>🏆 Ranking de Louvores</h2>
        <p>Os mais pedidos pela comunidade para o próximo repertório.</p>

        <table>
            <thead>
            <tr>
                <th>Posição</th>
                <th>Louvor</th>
                <th>Ministro</th>
                <th>Sugestões</th>
            </tr>
            </thead>
            <tbody id="corpoTabela">
            </tbody>
        </table>
    </div>
</div>

<script>
    async function carregarRanking() {
        // Chamamos a nova rota que criamos no Java (/ranking)
        const resposta = await fetch('/api/musicas/ranking');
        const musicas = await resposta.json();

        const tabela = document.getElementById('corpoTabela');
        tabela.innerHTML = '';

        musicas.forEach((musica, index) => {
            tabela.innerHTML += `
                    <tr>
                        <td><strong>${index + 1}º</strong></td>
                        <td>${musica.titulo}</td>
                        <td>${musica.ministro || '---'}</td>
                        <td><span class="highlight" style="font-weight: bold;">${musica.quantidadeSugestoes || 1}</span></td>
                    </tr>
                `;
        });
    }

    // Carrega o ranking assim que abre a página
    carregarRanking();
</script>
</body>
</html>
