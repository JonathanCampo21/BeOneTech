<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #050505;
            margin: 0;
            animation: none !important;
        }
        .login-box {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: contentFadeIn 0.5s ease-out forwards;
        }
        .login-box h1 { font-size: 32px; margin-bottom: 10px; color: white; }
        .login-box p { color: var(--text-dim); margin-bottom: 30px; font-size: 14px; }

        .login-input {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            font-family: 'Urbanist', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }
        .login-input:focus { border-color: var(--primary); }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Urbanist', sans-serif;
            margin-top: 10px;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Be One <span class="highlight">Tech</span></h1>
    <p>Acesso restrito à liderança e equipe.</p>

    <input type="text" id="usuario" class="login-input" placeholder="Usuário / Nome">
    <input type="password" id="senha" class="login-input" placeholder="Senha">

    <button class="btn-login" onclick="fazerLogin()">Entrar no Sistema</button>

    <p id="msgErro" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none;">Credenciais inválidas!</p>
</div>

<script>
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            fazerLogin();
        }
    });

    const DEPARTAMENTOS_CONFIG = {
        "LOUVOR": { cor: "#FF3300" },
        "MIDIA": { cor: "#190B28" },
        "SALT": { cor: "#121831" },
        "27+": { cor: "#10251A" },
        "JOIN": { cor: "#2F3C64" },
        "KIDS": { cor: "#FDD835" }
    };

    async function fazerLogin() {
        const usuarioInput = document.getElementById('usuario').value.trim();
        const senhaInput = document.getElementById('senha').value.trim();
        const msgErro = document.getElementById('msgErro');

        if (!usuarioInput || !senhaInput) {
            msgErro.innerText = "Preencha o usuário e a senha!";
            msgErro.style.display = 'block';
            return;
        }

        const btn = document.querySelector('.btn-login');
        btn.innerText = "Aguarde...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome: usuarioInput, senha: senhaInput })
            });

            if (res.ok) {
                const dados = await res.json();
                const departamentosUser = dados.departamentos || [];
                const cargoUser = String(dados.cargo || 'MEMBRO').toUpperCase().trim();

                // ---> NOVO: SALVANDO TUDO QUE IMPORTA PRO FRONT-END NÃO FICAR PERDIDO
                localStorage.setItem('token', dados.token);
                localStorage.setItem('usuario', JSON.stringify({
                    id: dados.id,
                    nome: dados.nome,
                    cargo: cargoUser,
                    fotoPerfil: dados.fotoPerfil,
                    departamentos: departamentosUser,
                    liderDe: dados.liderDe || "",     // Mochila de Liderança
                    funcao: dados.funcao || "",       // Funções gerais
                    whatsapp: dados.whatsapp || ""    // Contato
                }));

                document.body.style.opacity = '0';
                document.body.style.transition = '0.3s';

                setTimeout(() => {
                    // ---> REGRA DE DIRECIONAMENTO INTELIGENTE <---
                    
                    // 1. Se for Pastor, vai pro painel executivo
                    if (cargoUser === 'PASTOR') {
                        window.location.href = 'painel_pastor.html';
                    } 
                    // 2. Se for DEV/ADMIN ou tiver mais de 1 departamento, vai pro Portal escolher
                    else if (['DEV', 'ADMIN'].includes(cargoUser) || departamentosUser.length > 1) {
                        window.location.href = 'portal.html';
                    } 
                    // 3. Se for membro normal/líder com apenas 1 departamento, vai direto pro início dele
                    else {
                        const deptUnico = departamentosUser.length === 1 ? departamentosUser[0] : "LOUVOR";
                        const configCor = DEPARTAMENTOS_CONFIG[deptUnico] ? DEPARTAMENTOS_CONFIG[deptUnico].cor : "#FF3300";
                        
                        // Salva qual é a área e a cor pro sistema pintar sozinho
                        localStorage.setItem('departamentoAtual', deptUnico);
                        localStorage.setItem('corAtual', configCor);
                        
                        window.location.href = 'inicio.html';
                    }
                }, 300);

            } else {
                const erroTxt = await res.text();
                msgErro.innerText = erroTxt || "Usuário ou senha incorretos!";
                msgErro.style.display = 'block';
            }
        } catch (error) {
            console.error("Falha no login:", error);
            msgErro.innerText = "Erro de conexão com o servidor.";
            msgErro.style.display = 'block';
        } finally {
            btn.innerText = "Entrar no Sistema";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
