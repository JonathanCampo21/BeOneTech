<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Escala</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #ff5722; /* Cor padrão, o JS vai mudar de acordo com o ministério! */
        }
        
        body { 
            background: #e5e7eb; 
            font-family: 'Urbanist', sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: #111; 
            display: flex; 
            justify-content: center; 
        }
        .page-pdf { 
            background: #ffffff; 
            width: 100%; 
            max-width: 800px; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .header { 
            text-align: center; 
            border-bottom: 3px solid var(--primary); 
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        .header h1 { margin: 0; font-size: 26px; text-transform: uppercase; font-weight: 900; }
        .header p { margin: 5px 0 0 0; color: #555; font-size: 16px; font-weight: bold; }
        
        .section-title { 
            font-size: 18px; 
            font-weight: 900; 
            color: var(--primary); 
            margin-top: 30px; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 5px; 
            text-transform: uppercase;
        }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #333; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        
        .badge { 
            background: rgba(0, 0, 0, 0.05); 
            color: var(--primary); 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
        }

        .btn-print { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: var(--primary); 
            color: white; 
            text-align: center; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-family: 'Urbanist', sans-serif; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 40px; 
            transition: 0.3s; 
        }
        .btn-print:hover { filter: brightness(0.9); }

        .msg-erro {
            text-align: center;
            color: #ef4444;
            background: #fee2e2;
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        @media print {
            body { background: white; padding: 0; }
            .page-pdf { box-shadow: none; padding: 0; }
            .btn-print { display: none; }
        }
        @media (max-width: 600px) {
            .page-pdf { padding: 20px; }
            table, th, td { font-size: 13px; padding: 10px 5px; }
        }
    </style>
</head>
<body>

<div class="page-pdf">
    <div class="header">
        <h1 id="tituloEscala">Carregando Escala...</h1>
        <p id="dataEscala">Buscando informações</p>
    </div>

    <div id="conteudoEscala" style="display: none;"></div>

    <div id="mensagemErro" class="msg-erro" style="display: none;"></div>
</div>

<script>
    const DEPARTAMENTOS_CONFIG = {
        "LOUVOR": { cor: "#FF3300", icone: "fa-music" }, "MIDIA": { cor: "#a855f7", icone: "fa-camera" },
        "SALT": { cor: "#3b82f6", icone: "fa-users" }, "27+": { cor: "#10b981", icone: "fa-plus-circle" },
        "JOIN": { cor: "#6366f1", icone: "fa-handshake" }, "KIDS": { cor: "#facc15", icone: "fa-child" }
    };

    async function carregarEscalaWpp() {
        const params = new URLSearchParams(window.location.search);
        const idEscala = params.get('id');

        if (!idEscala) { mostrarErro("Link inválido. Escala não encontrada."); return; }

        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        try {
            const [resEscalas, resLouvores] = await Promise.all([
                fetch('/api/escalas', { headers }),
                fetch('/api/louvores', { headers })
            ]);

            if (resEscalas.status === 403 || resEscalas.status === 401) {
                mostrarErro("Acesso Negado! O servidor exige login para ver a escala. Peça ao TI para liberar a rota pública."); return;
            }

            const escalas = await resEscalas.json();
            const louvoresGlobais = resLouvores.ok ? await resLouvores.json() : [];
            const escala = escalas.find(e => e.id == idEscala);

            if (!escala) { mostrarErro("Escala removida ou inexistente."); return; }

            // Configuração do Ministério (Cor Mágica)
            const dept = escala.departamento || 'LOUVOR';
            const config = DEPARTAMENTOS_CONFIG[dept] || { cor: "#333", icone: "fa-star" };
            document.documentElement.style.setProperty('--primary', config.cor);

            document.getElementById('tituloEscala').innerHTML = `<i class="fas ${config.icone}"></i> ${escala.titulo || 'Escala Sem Título'}`;
            document.getElementById('dataEscala').innerText = escala.data ? escala.data.split('-').reverse().join('/') : 'Data Indefinida';

            // Separação de Equipe
            const vocal = []; const banda = []; const geral = [];
            
            if (escala.equipe) {
                const linhasEquipe = escala.equipe.split('\n').filter(Boolean);
                linhasEquipe.forEach(linha => {
                    let nome = linha; let funcao = 'Membro';
                    if (linha.includes('(') && linha.includes(')')) {
                        const openIdx = linha.lastIndexOf('('); const closeIdx = linha.lastIndexOf(')');
                        nome = linha.substring(0, openIdx).trim(); funcao = linha.substring(openIdx + 1, closeIdx).trim();
                    }

                    const fLow = funcao.toLowerCase();
                    const htmlLinha = `<tr><td><strong>${nome}</strong></td><td>${funcao}</td></tr>`;
                    
                    geral.push(htmlLinha); // Guarda todos aqui pra usar em outros ministérios

                    if (fLow.includes('vocal') || fLow.includes('ministr') || fLow.includes('voz') || fLow.includes('backing')) {
                        vocal.push(htmlLinha);
                    } else { banda.push(htmlLinha); }
                });
            }

            const htmlVazia = '<tr><td colspan="2" style="text-align:center; color: gray;">Nenhum voluntário escalado</td></tr>';
            let htmlDinamico = '';

            // LÓGICA DE EXIBIÇÃO: Louvor (Banda/Vocal/Repertório) vs Outros (Tabela Única)
            if (dept.toUpperCase() === 'LOUVOR') {
                htmlDinamico += `
                    <div class="section-title"><i class="fas fa-microphone"></i> Vocal & Ministros</div>
                    <table><thead><tr><th>Nome</th><th>Função</th></tr></thead><tbody>${vocal.length > 0 ? vocal.join('') : htmlVazia}</tbody></table>
                    
                    <div class="section-title"><i class="fas fa-guitar"></i> Banda</div>
                    <table><thead><tr><th>Nome</th><th>Instrumento</th></tr></thead><tbody>${banda.length > 0 ? banda.join('') : htmlVazia}</tbody></table>
                `;

                let repertorioHtml = [];
                if (escala.repertorio) {
                    const linhasMusicas = escala.repertorio.split('\n').filter(Boolean);
                    linhasMusicas.forEach(linha => {
                        let tituloPuro = linha; let tomInfo = '--';
                        if (linha.includes('(') && linha.includes(')')) {
                            const openIdx = linha.lastIndexOf('(');
                            tituloPuro = linha.substring(0, openIdx).trim();
                            tomInfo = linha.substring(openIdx + 1, linha.length - 1).trim();
                        }
                        const louvorOficial = louvoresGlobais.find(l => l.titulo.toLowerCase().trim() === tituloPuro.toLowerCase().trim());
                        const bpmInfo = louvorOficial && louvorOficial.bpm ? louvorOficial.bpm : '--';
                        const compInfo = louvorOficial && louvorOficial.compasso ? louvorOficial.compasso : '--';

                        repertorioHtml.push(`<tr>
                            <td><strong>${tituloPuro}</strong></td>
                            <td style="text-align: center;"><span class="badge">${tomInfo}</span></td>
                            <td style="text-align: center;">${bpmInfo}</td>
                            <td style="text-align: center;">${compInfo}</td>
                        </tr>`);
                    });
                }
                
                htmlDinamico += `
                    <div class="section-title"><i class="fas fa-list"></i> Repertório</div>
                    <table>
                        <thead><tr><th>Música</th><th style="text-align: center;">Tom</th><th style="text-align: center;">BPM</th><th style="text-align: center;">Compasso</th></tr></thead>
                        <tbody>${repertorioHtml.length > 0 ? repertorioHtml.join('') : '<tr><td colspan="4" style="text-align:center; color: gray;">Nenhum repertório definido</td></tr>'}</tbody>
                    </table>
                `;
            } else {
                // Outros Ministérios
                htmlDinamico += `
                    <div class="section-title"><i class="fas fa-users"></i> Equipe Escalada</div>
                    <table><thead><tr><th>Nome</th><th>Função</th></tr></thead><tbody>${geral.length > 0 ? geral.join('') : htmlVazia}</tbody></table>
                `;
            }

            htmlDinamico += `<button class="btn-print" onclick="window.print()"><i class="fas fa-file-pdf"></i> Salvar como PDF</button>`;
            
            document.getElementById('conteudoEscala').innerHTML = htmlDinamico;
            document.getElementById('conteudoEscala').style.display = 'block';

        } catch (error) { mostrarErro("Erro de conexão com o banco de dados."); }
    }

    function mostrarErro(mensagem) {
        document.getElementById('tituloEscala').innerText = "Oops!";
        document.getElementById('dataEscala').innerText = "";
        const divErro = document.getElementById('mensagemErro');
        divErro.innerText = mensagem;
        divErro.style.display = 'block';
    }

    carregarEscalaWpp();
</script>

</body>
</html>
