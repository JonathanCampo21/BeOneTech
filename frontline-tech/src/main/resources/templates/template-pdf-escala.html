<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Escala Be One Tech</title>
    <style>
        @page { size: A4 portrait; margin: 0; }
        body { font-family: sans-serif; background-color: #0a0a0a; color: #f3f4f6; margin: 0; padding: 15mm; }
        .escala-container { margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px dashed #333; padding-bottom: 20px;}
        .escala-container:last-child { border-bottom: none; }
        
        .header { text-align: center; border-bottom: 2px solid; padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 2px;}
        .header p { color: #9ca3af; margin: 5px 0 0 0; }
        
        h3 { margin-bottom: 10px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;}
        
        /* Box onde a lista de equipe e repertório será impressa */
        .text-box { 
            background: #111; 
            border: 1px solid #222; 
            padding: 15px; 
            border-radius: 8px; 
            color: #ddd; 
            font-size: 14px; 
            white-space: pre-wrap; /* Garante que as quebras de linha funcionem */
            line-height: 1.8; 
            border-left: 4px solid;
        }
    </style>
</head>
<body>

<div th:each="esc : ${escalas}" class="escala-container"
     th:with="corDept=${esc.departamento == 'LOUVOR' ? '#FF3300' :
                       esc.departamento == 'MIDIA' ? '#a855f7' :
                       esc.departamento == 'SALT' ? '#3b82f6' :
                       esc.departamento == '27+' ? '#10b981' :
                       esc.departamento == 'JOIN' ? '#6366f1' :
                       esc.departamento == 'KIDS' ? '#facc15' : '#ffffff'}">
                       
    <div class="header" th:style="'border-bottom-color: ' + ${corDept}">
        <h2 th:style="'color: ' + ${corDept}"><span th:text="${esc.titulo}"></span></h2>
        <p><span th:text="${esc.data}"></span></p>
    </div>

    <div style="width: 100%; margin-bottom: 20px;">
        <h3 th:style="'color: ' + ${corDept}"><span th:text="${esc.departamento != null ? esc.departamento + ' - EQUIPE' : 'EQUIPE ESCALADA'}"></span></h3>
        <div class="text-box" th:style="'border-left-color: ' + ${corDept}" th:text="${esc.equipe != null and esc.equipe != '' ? esc.equipe : 'Nenhum voluntário escalado.'}"></div>
    </div>
    
    <div th:if="${esc.departamento == 'LOUVOR' and esc.repertorio != null and esc.repertorio != ''}" style="width: 100%;">
        <h3 th:style="'color: ' + ${corDept}">Repertório Musical</h3>
        <div class="text-box" th:style="'border-left-color: ' + ${corDept}" th:text="${esc.repertorio}"></div>
    </div>
    
</div>

<p style="text-align: center; color: #444; font-size: 9px; margin-top: 20px;">DOCUMENTO OFICIAL GERADO POR BE ONE TECH</p>

</body>
</html>
