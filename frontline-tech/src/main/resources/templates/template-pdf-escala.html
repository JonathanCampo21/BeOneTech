<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Escala Be One Tech</title>
    <style>
        @page { size: A4 portrait; margin: 0; }
        body { font-family: sans-serif; background-color: #0a0a0a; color: #f3f4f6; margin: 0; padding: 15mm; }
        .escala-container { margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px dashed #333; padding-bottom: 20px;}
        .escala-container:last-child { border-bottom: none; }
        
        .header { text-align: center; border-bottom: 2px solid #555; padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 2px; color: #fff;}
        .header p { color: #9ca3af; margin: 5px 0 0 0; }
        
        h3 { margin-bottom: 10px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; color: #fff;}
        
        .equipe-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .equipe-table td { border: 1px solid #222; padding: 8px; text-align: left; background-color: #111; color: #ddd; font-size: 13px; }
        
        /* 🎨 THEME CLASSES (A prova de falhas) */
        .theme-LOUVOR .header { border-bottom-color: #FF3300; }
        .theme-LOUVOR .header h2, .theme-LOUVOR h3 { color: #FF3300; }
        .theme-LOUVOR .musica-box { border-left-color: #FF3300; }

        .theme-MIDIA .header { border-bottom-color: #a855f7; }
        .theme-MIDIA .header h2, .theme-MIDIA h3 { color: #a855f7; }

        .theme-SALT .header { border-bottom-color: #3b82f6; }
        .theme-SALT .header h2, .theme-SALT h3 { color: #3b82f6; }

        .theme-JOIN .header { border-bottom-color: #6366f1; }
        .theme-JOIN .header h2, .theme-JOIN h3 { color: #6366f1; }

        .theme-KIDS .header { border-bottom-color: #facc15; }
        .theme-KIDS .header h2, .theme-KIDS h3 { color: #facc15; }

        .musica-box { background: #111; border: 1px solid #222; border-left: 4px solid #555; padding: 12px; margin-bottom: 10px; }
        
        .btn-pdf { display: inline-block; padding: 6px 10px; margin-right: 8px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: bold; background: #1a1a1a; border: 1px solid #333; }
        .btn-yt { color: #ff4b4b; border-color: #ff4b4b; }
        .btn-cifra { color: #3b82f6; border-color: #3b82f6; }
        .btn-vs { color: #a78bfa; border-color: #a78bfa; }
        .btn-letra { color: #10b981; border-color: #10b981; }
    </style>
</head>
<body>

<div th:each="esc : ${escalas}" th:if="${esc.titulo != null and !esc.titulo.contains('[LIDERANÇA]')}" 
     th:class="'escala-container theme-' + ${esc.departamento != null ? esc.departamento : 'LOUVOR'}">

    <div class="header">
        <h2><span th:text="${esc.titulo}"></span></h2>
        <p><span th:text="${esc.data}"></span></p>
    </div>

    <div th:if="${esc.departamento == 'LOUVOR'}" style="width: 100%;">
        <div style="width: 48%; float: left;">
            <h3>Vocal / Ministros</h3>
            <table class="equipe-table">
                <tr th:if="${esc.vocal != null and not #lists.isEmpty(esc.vocal)}" th:each="membro : ${esc.vocal}">
                    <td style="font-weight: bold; width: 45%; color: #fff;"><span th:text="${membro.nome}"></span></td>
                    <td><span th:text="${membro.funcao}"></span></td>
                </tr>
                <tr th:if="${esc.vocal == null or #lists.isEmpty(esc.vocal)}">
                    <td colspan="2" style="color: gray; text-align: center;">Ninguém escalado</td>
                </tr>
            </table>
        </div>
        <div style="width: 48%; float: right;">
            <h3>Banda</h3>
            <table class="equipe-table">
                <tr th:if="${esc.banda != null and not #lists.isEmpty(esc.banda)}" th:each="membro : ${esc.banda}">
                    <td style="font-weight: bold; width: 45%; color: #fff;"><span th:text="${membro.nome}"></span></td>
                    <td><span th:text="${membro.funcao}"></span></td>
                </tr>
                <tr th:if="${esc.banda == null or #lists.isEmpty(esc.banda)}">
                    <td colspan="2" style="color: gray; text-align: center;">Ninguém escalado</td>
                </tr>
            </table>
        </div>
        <div style="clear: both;"></div>
    </div>
    
    <div th:unless="${esc.departamento == 'LOUVOR'}" style="width: 100%;">
        <h3>Equipe Escalada</h3>
        <table class="equipe-table">
            <tbody>
                <tr th:if="${esc.vocal != null}" th:each="membro : ${esc.vocal}">
                    <td style="font-weight: bold; width: 45%; color: #fff;"><span th:text="${membro.nome}"></span></td>
                    <td><span th:text="${membro.funcao}"></span></td>
                </tr>
                <tr th:if="${esc.banda != null}" th:each="membro : ${esc.banda}">
                    <td style="font-weight: bold; width: 45%; color: #fff;"><span th:text="${membro.nome}"></span></td>
                    <td><span th:text="${membro.funcao}"></span></td>
                </tr>
                <tr th:if="${(esc.vocal == null or #lists.isEmpty(esc.vocal)) and (esc.banda == null or #lists.isEmpty(esc.banda))}">
                    <td colspan="2" style="color: gray; text-align: center;">Ninguém escalado</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:if="${isIndividual != null and isIndividual and escala != null and escala.departamento == 'LOUVOR' and escala.repertorio != null and not #lists.isEmpty(escala.repertorio)}" 
     class="theme-LOUVOR" style="page-break-before: always;">
     
    <div class="header" style="margin-top: 10px;">
        <h2>Guia de Estudo - Repertório</h2>
        <p><span th:text="${escala.titulo}"></span> - <span th:text="${escala.data}"></span></p>
    </div>

    <div th:each="musica : ${escala.repertorio}" class="musica-box">
        <h3 style="margin: 0 0 5px 0; color: #fff; text-transform: none; font-size: 16px;">
            <span th:text="${musica.titulo}"></span>
            <span style="color: #FF3300;">(<span th:text="${musica.tom}"></span>)</span>
        </h3>

        <p style="margin: 0 0 10px 0; font-size: 11px; color: #aaa;">
            <strong style="color: #FF3300;">BPM:</strong> <span th:text="${musica.bpm}"></span> |
            <strong style="color: #FF3300;">COMPASSO:</strong> <span th:text="${musica.compasso}"></span>
        </p>

        <div style="margin-top: 5px;">
            <a th:if="${musica.linkYoutube != null and musica.linkYoutube != ''}" th:href="${musica.linkYoutube}" class="btn-pdf btn-yt">▶ YOUTUBE</a>
            <a th:if="${musica.linkCifra != null and musica.linkCifra != ''}" th:href="${musica.linkCifra}" class="btn-pdf btn-cifra">🎵 CIFRA</a>
            <a th:if="${musica.linkLetra != null and musica.linkLetra != ''}" th:href="${musica.linkLetra}" class="btn-pdf btn-letra">📝 LETRA</a>
            <a th:if="${musica.linkVs != null and musica.linkVs != ''}" th:href="${musica.linkVs}" class="btn-pdf btn-vs">🎧 VS / MULTITRACK</a>
        </div>
    </div>
</div>

<p style="text-align: center; color: #444; font-size: 9px; margin-top: 20px;">DOCUMENTO GERADO POR BE ONE TECH</p>

</body>
</html>
