<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Escala</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ESTILO "DOCUMENTO PDF" - Limpo, Branco e Formal */
        body { 
            background: #e5e7eb; 
            font-family: 'Urbanist', sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: #111; 
            display: flex; 
            justify-content: center; 
        }
        .page-pdf { 
            background: #ffffff; 
            width: 100%; 
            max-width: 800px; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        .header { 
            text-align: center; 
            border-bottom: 3px solid #ff5722; /* Cor de destaque da sua logo */
            padding-bottom: 20px; 
            margin-bottom: 30px; 
        }
        .header h1 { margin: 0; font-size: 26px; text-transform: uppercase; font-weight: 900; }
        .header p { margin: 5px 0 0 0; color: #555; font-size: 16px; font-weight: bold; }
        
        .section-title { 
            font-size: 18px; 
            font-weight: 900; 
            color: #ff5722; 
            margin-top: 30px; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 5px; 
            text-transform: uppercase;
        }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #333; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        
        .badge { 
            background: rgba(255, 87, 34, 0.1); 
            color: #ff5722; 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
        }

        .btn-print { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: #ff5722; 
            color: white; 
            text-align: center; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-family: 'Urbanist', sans-serif; 
            cursor: pointer; 
            font-size: 16px; 
            margin-top: 40px; 
            transition: 0.3s; 
        }
        .btn-print:hover { background: #e64a19; }

        .msg-erro {
            text-align: center;
            color: #ef4444;
            background: #fee2e2;
            padding: 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Esconde o botão de imprimir quando for gerar PDF ou imprimir a folha */
        @media print {
            body { background: white; padding: 0; }
            .page-pdf { box-shadow: none; padding: 0; }
            .btn-print { display: none; }
        }
        @media (max-width: 600px) {
            .page-pdf { padding: 20px; }
            table, th, td { font-size: 13px; padding: 10px 5px; }
        }
    </style>
</head>
<body>

<div class="page-pdf">
    <div class="header">
        <h1 id="tituloEscala">Carregando Escala...</h1>
        <p id="dataEscala">Buscando informações</p>
    </div>

    <div id="conteudoEscala" style="display: none;">
        
        <div class="section-title"><i class="fas fa-microphone"></i> Vocal & Ministros</div>
        <table>
            <thead><tr><th>Nome</th><th>Função</th></tr></thead>
            <tbody id="tabelaVocal"></tbody>
        </table>

        <div class="section-title"><i class="fas fa-guitar"></i> Banda</div>
        <table>
            <thead><tr><th>Nome</th><th>Instrumento</th></tr></thead>
            <tbody id="tabelaBanda"></tbody>
        </table>

        <div class="section-title"><i class="fas fa-list"></i> Repertório</div>
        <table>
            <thead>
                <tr>
                    <th>Música</th>
                    <th style="text-align: center;">Tom</th>
                    <th style="text-align: center;">BPM</th>
                    <th style="text-align: center;">Compasso</th>
                </tr>
            </thead>
            <tbody id="tabelaRepertorio"></tbody>
        </table>

        <button class="btn-print" onclick="window.print()">
            <i class="fas fa-file-pdf"></i> Salvar Folha como PDF
        </button>
    </div>

    <div id="mensagemErro" class="msg-erro" style="display: none;"></div>
</div>

<script>
    async function carregarEscalaWpp() {
        const params = new URLSearchParams(window.location.search);
        const idEscala = params.get('id');

        if (!idEscala) {
            mostrarErro("Link inválido. Escala não encontrada.");
            return;
        }

        // Tenta pegar o token do cache caso o usuário seja da liderança testando do próprio PC
        const token = localStorage.getItem('token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        try {
            // Busca Escalas e Louvores simultaneamente
            const [resEscalas, resLouvores] = await Promise.all([
                fetch('/api/escalas', { headers }),
                fetch('/api/louvores', { headers })
            ]);

            if (resEscalas.status === 403 || resEscalas.status === 401) {
                mostrarErro("Acesso Negado! O servidor exige login para ver a escala. Peça ao TI para liberar a rota pública.");
                return;
            }

            const escalas = await resEscalas.json();
            const louvoresGlobais = resLouvores.ok ? await resLouvores.json() : [];
            
            const escala = escalas.find(e => e.id == idEscala);

            if (!escala) {
                mostrarErro("Escala removida ou inexistente.");
                return;
            }

            // 1. Renderiza Cabeçalho
            document.getElementById('tituloEscala').innerText = escala.titulo || 'Escala Sem Título';
            document.getElementById('dataEscala').innerText = escala.data ? escala.data.split('-').reverse().join('/') : 'Data Indefinida';

            // 2. Processa Equipe (Separando Vocal e Banda igualzinho o PDF)
            const vocal = [];
            const banda = [];

            if (escala.equipe) {
                const linhasEquipe = escala.equipe.split('\n').filter(Boolean);
                linhasEquipe.forEach(linha => {
                    let nome = linha;
                    let funcao = 'Membro';

                    if (linha.includes('(') && linha.includes(')')) {
                        const openIdx = linha.lastIndexOf('(');
                        const closeIdx = linha.lastIndexOf(')');
                        nome = linha.substring(0, openIdx).trim();
                        funcao = linha.substring(openIdx + 1, closeIdx).trim();
                    }

                    const fLow = funcao.toLowerCase();
                    const htmlLinha = `<tr><td><strong>${nome}</strong></td><td>${funcao}</td></tr>`;

                    if (fLow.includes('vocal') || fLow.includes('ministr') || fLow.includes('voz') || fLow.includes('backing')) {
                        vocal.push(htmlLinha);
                    } else {
                        banda.push(htmlLinha);
                    }
                });
            }

            document.getElementById('tabelaVocal').innerHTML = vocal.length > 0 ? vocal.join('') : '<tr><td colspan="2" style="text-align:center; color: gray;">Nenhum vocal escalado</td></tr>';
            document.getElementById('tabelaBanda').innerHTML = banda.length > 0 ? banda.join('') : '<tr><td colspan="2" style="text-align:center; color: gray;">Nenhum músico escalado</td></tr>';

            // 3. Processa Repertório
            let repertorioHtml = [];
            if (escala.repertorio) {
                const linhasMusicas = escala.repertorio.split('\n').filter(Boolean);
                linhasMusicas.forEach(linha => {
                    let tituloPuro = linha;
                    let tomInfo = '--';
                    
                    if (linha.includes('(') && linha.includes(')')) {
                        const openIdx = linha.lastIndexOf('(');
                        tituloPuro = linha.substring(0, openIdx).trim();
                        tomInfo = linha.substring(openIdx + 1, linha.length - 1).trim();
                    }

                    // Encontra a música no banco para puxar BPM e Compasso
                    const louvorOficial = louvoresGlobais.find(l => l.titulo.toLowerCase().trim() === tituloPuro.toLowerCase().trim());
                    const bpmInfo = louvorOficial && louvorOficial.bpm ? louvorOficial.bpm : '--';
                    const compInfo = louvorOficial && louvorOficial.compasso ? louvorOficial.compasso : '--';

                    repertorioHtml.push(`
                        <tr>
                            <td><strong>${tituloPuro}</strong></td>
                            <td style="text-align: center;"><span class="badge">${tomInfo}</span></td>
                            <td style="text-align: center;">${bpmInfo}</td>
                            <td style="text-align: center;">${compInfo}</td>
                        </tr>
                    `);
                });
            }

            document.getElementById('tabelaRepertorio').innerHTML = repertorioHtml.length > 0 ? repertorioHtml.join('') : '<tr><td colspan="4" style="text-align:center; color: gray;">Nenhum repertório definido</td></tr>';

            // Mostra o conteúdo
            document.getElementById('conteudoEscala').style.display = 'block';

        } catch (error) {
            mostrarErro("Erro de conexão com o banco de dados.");
        }
    }

    function mostrarErro(mensagem) {
        document.getElementById('tituloEscala').innerText = "Oops!";
        document.getElementById('dataEscala').innerText = "";
        const divErro = document.getElementById('mensagemErro');
        divErro.innerText = mensagem;
        divErro.style.display = 'block';
    }

    carregarEscalaWpp();
</script>

</body>
</html>
