<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    let user = JSON.parse(localStorage.getItem('usuario'));
    if (!user || !user.id) location.href = 'index.html';

    // FUNÇÃO MELHORADA: Busca os dados fresquinhos do banco!
    async function carregarDados() {
        try {
            const res = await fetch('/api/membros');
            if (res.ok) {
                const membros = await res.json();
                // Acha você na lista do banco de dados
                const userAtualizado = membros.find(m => m.id === user.id);
                if (userAtualizado) {
                    user = userAtualizado;
                    // Atualiza a memória do celular com o zap novo
                    localStorage.setItem('usuario', JSON.stringify(user)); 
                }
            }
        } catch(e) {
            console.log("Buscando do cache local.");
        }

        document.getElementById('nomePerfil').value = user.nome || '';
        document.getElementById('whatsappPerfil').value = user.whatsapp || '';
        document.getElementById('cargoPerfil').value = user.cargo || 'MEMBRO';

        if(user.cargo && user.cargo.toUpperCase().trim() === 'PASTOR') {
            document.getElementById('badgePastor').style.display = 'block';
        }

        const cargoUser = String(user.cargo).toUpperCase().trim();
        if (cargoUser === 'ADMIN' || cargoUser === 'DEV') {
            const linkAdmin = document.getElementById('linkAdmin');
            if(linkAdmin) { linkAdmin.classList.remove('admin-only'); linkAdmin.style.display = 'flex'; }
        }
    }

    function habilitarEdicao(id) {
        const input = document.getElementById(id);
        input.disabled = false;
        input.classList.add('editing');
        input.focus();
        
        // Coloca o cursor no fim do texto
        const val = input.value;
        input.value = '';
        input.value = val;

        document.getElementById('areaSalvar').style.display = 'block';
    }

    function toggleSenha() {
        const section = document.getElementById('senhaSection');
        if(section.style.display === 'block') {
            // Se fechar, apaga o que estava digitado pra não enviar sem querer
            section.style.display = 'none';
            document.getElementById('senhaPerfil').value = '';
            document.getElementById('confirmarSenhaPerfil').value = '';
        } else {
            section.style.display = 'block';
            document.getElementById('areaSalvar').style.display = 'block';
            document.getElementById('senhaPerfil').focus();
        }
    }

    async function atualizarPerfil() {
        const nome = document.getElementById('nomePerfil').value.trim();
        // Pega o zap e remove os espaços ou traços caso o usuário digite
        const whatsapp = document.getElementById('whatsappPerfil').value.replace(/\D/g, ''); 
        const senha = document.getElementById('senhaPerfil').value;
        const confirma = document.getElementById('confirmarSenhaPerfil').value;

        if (!nome) return alert("O nome não pode ficar vazio.");
        if (senha && senha !== confirma) return alert("As senhas digitadas não são iguais!");

        // PACOTE INTELIGENTE: Só as informações que importam
        const dadosAtualizados = {
            nome: nome,
            whatsapp: whatsapp,
            cargo: user.cargo,
            funcao: user.funcao
        };

        // Só envia a senha se a pessoa preencheu a caixa de nova senha
        if (senha) {
            dadosAtualizados.senha = senha;
        }

        const btn = document.querySelector('.btn-save');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
        btn.disabled = true;

        try {
            const res = await fetch(`/api/membros/${user.id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(dadosAtualizados)
            });

            if (res.ok) {
                const salvo = await res.json();
                localStorage.setItem('usuario', JSON.stringify(salvo));
                alert("Dados atualizados com sucesso!");
                location.reload();
            } else {
                // Se o Java der erro agora, ele vai cuspir o motivo real na tela
                const erro = await res.text();
                alert("O servidor recusou a atualização: " + erro);
            }
        } catch (e) {
            alert("Erro de conexão com o servidor. Verifique a internet.");
        } finally {
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Salvar Alterações';
            btn.disabled = false;
        }
    }

    function sair() {
        localStorage.removeItem('usuario');
        window.location.href = 'index.html';
    }

    carregarDados();
</script>
