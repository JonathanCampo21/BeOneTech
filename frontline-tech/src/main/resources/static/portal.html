<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Urbanist', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            color: #888;
            margin-bottom: 40px;
            text-align: center;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .dept-card {
            background: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .dept-icon {
            font-size: 30px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
        }

        .dept-name {
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-sair {
            margin-top: 50px;
            background: none;
            border: none;
            color: #ef4444;
            font-family: 'Urbanist', sans-serif;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <h1>Bem-vindo, <span id="nomeUser">Líder</span>!</h1>
    <p class="subtitle">Selecione o ministério que deseja acessar</p>

    <div class="portal-grid" id="gridDepartamentos"></div>

    <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair do Sistema</button>

<script>
    const DEPARTAMENTOS_CONFIG = {
        "LOUVOR": { cor: "#FF3300", icone: "fa-music" },
        "MIDIA": { cor: "#190B28", icone: "fa-camera" },
        "SALT": { cor: "#121831", icone: "fa-users" },
        "27+": { cor: "#10251A", icone: "fa-plus-circle" },
        "JOIN": { cor: "#2F3C64", icone: "fa-handshake" },
        "KIDS": { cor: "#FDD835", icone: "fa-child" }
    };

    const userLogado = JSON.parse(localStorage.getItem('usuario')) || {};
    const cargoUser = String(userLogado.cargo || 'MEMBRO').toUpperCase().trim();
    
    document.getElementById('nomeUser').innerText = userLogado.nome ? userLogado.nome.split(' ')[0] : 'Visitante';

    function renderizarPortal() {
        const grid = document.getElementById('gridDepartamentos');
        let deptsParaMostrar = [];
        
        // Se for Pastor, Dev ou Admin, abre as portas de tudo
        if (['PASTOR', 'DEV', 'ADMIN'].includes(cargoUser)) {
            deptsParaMostrar = Object.keys(DEPARTAMENTOS_CONFIG);
        } else {
            // Se for líder ou membro multi-área, renderiza apenas o que ele gerencia
            deptsParaMostrar = (userLogado.departamentos && userLogado.departamentos.length > 0) ? userLogado.departamentos : ["LOUVOR"];
        }

        grid.innerHTML = deptsParaMostrar.map(dept => {
            const config = DEPARTAMENTOS_CONFIG[dept] || { cor: "#3b82f6", icone: "fa-star" };
            
            return `
                <div class="dept-card" style="border-color: ${config.cor}40;" onmouseover="this.style.borderColor='${config.cor}'; this.style.background='${config.cor}15'" onmouseout="this.style.borderColor='${config.cor}40'; this.style.background='#111'" onclick="entrarDepartamento('${dept}', '${config.cor}')">
                    <div class="dept-icon" style="color: ${config.cor}; border: 1px solid ${config.cor}50; background: ${config.cor}05;">
                        <i class="fas ${config.icone}"></i>
                    </div>
                    <div class="dept-name" style="color: ${config.cor};">${dept}</div>
                </div>
            `;
        }).join('');
    }

    function entrarDepartamento(nomeDept, corDept) {
        localStorage.setItem('departamentoAtual', nomeDept);
        localStorage.setItem('corAtual', corDept);
        window.location.href = 'inicio.html';
    }

    function sair() {
        localStorage.removeItem('usuario');
        localStorage.removeItem('token');
        localStorage.removeItem('departamentoAtual');
        localStorage.removeItem('corAtual');
        window.location.href = 'login.html'; 
    }

    renderizarPortal();
</script>
</body>
</html>
