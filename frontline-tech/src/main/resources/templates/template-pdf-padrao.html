<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Escala Be One Tech</title>
    <style>
        @page { size: A4 portrait; margin: 0; }
        body { font-family: sans-serif; background-color: #0a0a0a; color: #f3f4f6; margin: 0; padding: 15mm; }
        .escala-container { margin-bottom: 30px; page-break-inside: avoid; border-bottom: 1px dashed #333; padding-bottom: 20px;}
        .escala-container:last-child { border-bottom: none; }
        .header { text-align: center; border-bottom: 2px solid; padding-bottom: 10px; margin-bottom: 20px; }
        .header h2 { margin: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 2px;}
        .header p { color: #9ca3af; margin: 5px 0 0 0; }
        h3 { margin-bottom: 10px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;}
        .equipe-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .equipe-table td { border: 1px solid #222; padding: 8px; text-align: left; background-color: #111; color: #ddd; font-size: 13px; }
    </style>
</head>
<body>

<div th:each="esc : ${escalas}" class="escala-container"
     th:with="corDept=${esc.departamento == 'MIDIA' ? '#a855f7' :
                       esc.departamento == 'SALT' ? '#3b82f6' :
                       esc.departamento == '27+' ? '#10b981' :
                       esc.departamento == 'JOIN' ? '#6366f1' :
                       esc.departamento == 'KIDS' ? '#facc15' : '#ffffff'}">
                       
    <div class="header" th:style="'border-bottom-color: ' + ${corDept}">
        <h2 th:style="'color: ' + ${corDept}"><span th:text="${esc.titulo}"></span></h2>
        <p><span th:text="${esc.data}"></span></p>
    </div>

    <div style="width: 100%;">
        <h3 th:style="'color: ' + ${corDept}">Equipe Escalada</h3>
        <table class="equipe-table">
            <tr th:if="${not #lists.isEmpty(esc.equipeGeral)}" th:each="membro : ${esc.equipeGeral}">
                <td style="font-weight: bold; width: 45%; color: #fff;"><span th:text="${membro.nome}"></span></td>
                <td><span th:text="${membro.funcao}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(esc.equipeGeral)}">
                <td colspan="2" style="color: gray; text-align: center; font-style: italic;">Ninguém escalado</td>
            </tr>
        </table>
    </div>
</div>

<p style="text-align: center; color: #444; font-size: 9px; margin-top: 20px;">DOCUMENTO GERADO POR BE ONE TECH</p>
</body>
</html>
