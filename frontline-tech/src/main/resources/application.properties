# ==========================================
# CONFIGURAÇÕES DE BANCO DE DADOS (NUVEM E LOCAL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beone_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:240922}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURAÇÕES DO JWT SECURITY
# ==========================================
api.security.token.secret=${JWT_SECRET:MinhaChaveSecretaSuperSeguraBeOneTech2024}