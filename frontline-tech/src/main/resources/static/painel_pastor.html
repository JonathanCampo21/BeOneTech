<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Visão Geral</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #10b981; --text-dim: #a0a0a0; --bg-card: #0f1011; --border-color: #222; }
        
        body { background-color: #050505; color: #fff; font-family: 'Urbanist', sans-serif; margin: 0; padding: 0; overflow-x: hidden;}
        
        /* O BRILHO CINEMATOGRÁFICO DO VÍDEO NO FUNDO DA TELA */
        .ambient-glow { position: fixed; top: -10%; left: -10%; width: 60vw; height: 60vh; background: radial-gradient(circle, rgba(162, 255, 0, 0.05) 0%, transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }
        .ambient-glow-2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vh; background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 60%); filter: blur(80px); z-index: -1; pointer-events: none; }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 26px; display: flex; align-items: center; gap: 10px; font-weight: 900;}
        .header h1 i { color: #a2ff00; }
        .btn-sair { background: rgba(239, 68, 68, 0.05); border: 1px solid #ef4444; color: #ef4444; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; font-family: 'Urbanist'; }
        .btn-sair:hover { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);}
        
        /* GRID DE LAYOUT (ESQUERDA: MINISTÉRIOS | DIREITA: CALENDÁRIO) */
        .main-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }

        /* KPIs SUPERIORES */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 16px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .kpi-icon { width: 50px; height: 50px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .kpi-text h4 { margin: 0; font-size: 24px; font-weight: 900; color: #fff; }
        .kpi-text p { margin: 0; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; margin-top: 2px;}

        .section-title { font-size: 18px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; color: #ccc; border-left: 3px solid #a2ff00; padding-left: 10px;}

        /* A SUA ESSÊNCIA: OS CARDS DE MINISTÉRIOS */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .dept-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2);}
        .dept-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dept-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .dept-icon { font-size: 24px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(255,255,255,0.05); }
        .dept-title { font-weight: 900; font-size: 18px; text-transform: uppercase; }
        .dept-action { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; font-weight: bold;}
        .glow { position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; border-radius: 50%; filter: blur(40px); opacity: 0.2; transition: 0.3s;}
        .dept-card:hover .glow { opacity: 0.4; transform: scale(1.2);}

        /* PAINEL DA DIREITA (CALENDÁRIO) */
        .side-panel { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 25px; height: fit-content;}
        
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-header h2 { margin: 0; font-size: 20px; color: #fff; }
        .btn-add { background: #a2ff00; color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Urbanist'; font-size: 13px; transition: 0.2s;}
        .btn-add:hover { background: #8be600; transform: scale(1.05); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
        .cal-day-name { text-align: center; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; padding-bottom: 10px;}
        .cal-day { background: #151719; border: 1px solid transparent; border-radius: 10px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: bold; color: #fff; position: relative; cursor: pointer; transition: 0.2s;}
        .cal-day:hover { border-color: #444; background: #1c1e21; }
        .cal-day.today { border-color: #a2ff00; color: #a2ff00; background: rgba(162, 255, 0, 0.05);}
        .cal-day.other-month { opacity: 0.2; pointer-events: none;}
        .event-dot { width: 5px; height: 5px; border-radius: 50%; position: absolute; bottom: 6px; }

        /* ALERTAS PASTORAIS */
        .alert-box { background: rgba(239, 68, 68, 0.05); border: 1px dashed rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 15px; margin-top: 20px;}
        .alert-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 10px 0;}
        .alert-item:last-child { border-bottom: none; padding-bottom: 0;}
        .alert-name { font-size: 14px; color: #fff; font-weight: bold;}
        .alert-reason { font-size: 11px; color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 3px 8px; border-radius: 10px;}

        /* MODAL GLOBAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; font-weight: bold;}
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #151719; border: 1px solid #333; color: white; border-radius: 8px; font-family: 'Urbanist'; outline: none; box-sizing: border-box;}
        .form-group input:focus, .form-group select:focus { border-color: #a2ff00; }
        .btn-salvar { width: 100%; padding: 15px; background: #a2ff00; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Urbanist'; margin-top: 10px; transition: 0.2s;}
        .btn-salvar:hover { background: #8be600; }

        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; }
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chess-king"></i> Ministério Be One <span style="color: gray; font-size: 16px; margin-left: 10px;" id="nomePastor"></span></h1>
            <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair do Sistema</button>
        </div>

        <div class="main-layout">
            
            <div class="left-col">
                <h2 class="section-title">Resumo Operacional</h2>
                
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon" style="color: #10b981;"><i class="fas fa-users"></i></div>
                        <div class="kpi-text"><h4 id="kpiTotal">0</h4><p>Total de Membros</p></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon" style="color: #3b82f6;"><i class="fas fa-crown"></i></div>
                        <div class="kpi-text"><h4 id="kpiLideres">0</h4><p>Líderes de Área</p></div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon" style="color: #ef4444;"><i class="fas fa-user-injured"></i></div>
                        <div class="kpi-text"><h4 id="kpiFaltas">0</h4><p>Ausências no Mês</p></div>
                    </div>
                </div>

                <h2 class="section-title" style="margin-top: 40px;">Gestão de Áreas</h2>
                <p style="color: var(--text-dim); margin-bottom: 20px; font-size: 14px;">Selecione o ministério abaixo para visualizar as escalas e gerenciar a equipe daquela área.</p>

                <div class="dashboard-grid" id="gridDepartamentos"></div>
            </div>

            <div class="right-col">
                <div class="side-panel">
                    <div class="cal-header">
                        <h2 id="mesAnoTitulo">Mês 2024</h2>
                        <button class="btn-add" onclick="abrirModalEvento()"><i class="fas fa-plus"></i> Evento</button>
                    </div>

                    <div class="cal-grid" id="calendarioGrid">
                        </div>

                    <div class="alert-box">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #ef4444; font-weight: bold; font-size: 14px; text-transform: uppercase;">
                            <i class="fas fa-exclamation-triangle"></i> Atenção Pastoral
                        </div>
                        <div id="listaAlertas">
                            <p style="color: #888; font-size: 12px; margin: 0;">Buscando dados de assiduidade...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="modalNovoEvento" onclick="if(event.target === this) fecharModal()">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; color: #a2ff00; font-size: 20px;"><i class="fas fa-calendar-plus"></i> Novo Evento</h3>
                <i class="fas fa-times" style="cursor: pointer; color: #888;" onclick="fecharModal()"></i>
            </div>
            
            <div class="form-group">
                <label>Título do Evento / Culto</label>
                <input type="text" id="evTitulo" placeholder="Ex: Culto de Celebração">
            </div>
            <div class="form-group">
                <label>Data Oficial</label>
                <input type="date" id="evData">
            </div>
            <div class="form-group">
                <label>Vincular a qual Ministério?</label>
                <select id="evDept">
                    <option value="LOUVOR">LOUVOR</option>
                    <option value="MIDIA">MÍDIA</option>
                    <option value="SALT">SALT</option>
                    <option value="27+">27+</option>
                    <option value="JOIN">JOIN</option>
                    <option value="KIDS">KIDS</option>
                </select>
            </div>
            <button class="btn-salvar" onclick="salvarEventoPastor()"><i class="fas fa-check"></i> Criar Escala Base</button>
        </div>
    </div>

<script>
    const userLogado = JSON.parse(localStorage.getItem('usuario')) || {};
    if(userLogado.cargo !== 'PASTOR' && userLogado.cargo !== 'DEV') {
        window.location.href = 'login.html'; 
    }
    
    document.getElementById('nomePastor').innerText = "| Pr. " + (userLogado.nome ? userLogado.nome.split(' ')[0] : 'Pastor');

    const DEPARTAMENTOS_CONFIG = {
        "LOUVOR": { cor: "#FF3300", icone: "fa-music", desc: "Escalas, Repertórios e Sugestões" },
        "MIDIA": { cor: "#a855f7", icone: "fa-camera", desc: "Escalas de Transmissão e Foto" },
        "SALT": { cor: "#3b82f6", icone: "fa-users", desc: "Escalas e Gestão de Membros" },
        "27+": { cor: "#10b981", icone: "fa-plus-circle", desc: "Escalas e Gestão de Membros" },
        "JOIN": { cor: "#6366f1", icone: "fa-handshake", desc: "Escalas e Recepção" },
        "KIDS": { cor: "#facc15", icone: "fa-child", desc: "Escalas do Ministério Infantil" }
    };

    let escalasGlobais = [];

    async function inicializarDashboard() {
        // 1. RENDERIZA OS CARDS ORIGINAIS DA SUA TELA
        renderizarCardsMinisterio();

        try {
            // 2. BUSCA OS DADOS GLOBAIS NO BACKEND
            const [resMembros, resEscalas, resFaltas] = await Promise.all([
                fetch('/api/membros'),
                fetch('/api/escalas'),
                fetch('/api/indisponibilidade')
            ]);

            let membros = []; let faltas = [];
            if(resMembros.ok) membros = await resMembros.json();
            if(resEscalas.ok) escalasGlobais = await resEscalas.json();
            if(resFaltas.ok) faltas = await resFaltas.json();

            // 3. PREENCHE OS KPIs
            document.getElementById('kpiTotal').innerText = membros.length;
            document.getElementById('kpiLideres').innerText = membros.filter(m => String(m.cargo).toUpperCase() === 'LIDER' || String(m.cargo).toUpperCase() === 'PASTOR').length;
            
            const mesAtual = new Date().getMonth();
            const anoAtual = new Date().getFullYear();
            const faltasMes = faltas.filter(f => f.data && new Date(f.data).getMonth() === mesAtual && new Date(f.data).getFullYear() === anoAtual);
            document.getElementById('kpiFaltas').innerText = faltasMes.length;

            // 4. PREENCHE OS ALERTAS (Quem faltou >= 2 vezes no mês)
            const contagemFaltas = {};
            faltasMes.forEach(f => { contagemFaltas[f.nomeMembro.trim()] = (contagemFaltas[f.nomeMembro.trim()] || 0) + 1; });
            
            const listaAlertas = document.getElementById('listaAlertas');
            let htmlAlertas = '';
            Object.keys(contagemFaltas).forEach(nome => {
                if(contagemFaltas[nome] >= 2) {
                    htmlAlertas += `<div class="alert-item"><span class="alert-name">${nome}</span><span class="alert-reason">${contagemFaltas[nome]} Faltas</span></div>`;
                }
            });
            listaAlertas.innerHTML = htmlAlertas || '<p style="color: #888; font-size: 12px; margin: 0;">Equipe assídua. Nenhum alerta.</p>';

            // 5. DESENHA O CALENDÁRIO
            gerarCalendario();

        } catch (e) {
            console.error("Erro na carga de dados", e);
        }
    }

    // A FUNÇÃO ORIGINAL DOS SEUS CARDS (Apenas ajustada para o novo HTML)
    function renderizarCardsMinisterio() {
        const grid = document.getElementById('gridDepartamentos');
        const departamentos = Object.keys(DEPARTAMENTOS_CONFIG);

        grid.innerHTML = departamentos.map(dept => {
            const config = DEPARTAMENTOS_CONFIG[dept];
            return `
                <div class="dept-card" style="border-color: ${config.cor}40;" onmouseover="this.style.borderColor='${config.cor}'" onmouseout="this.style.borderColor='${config.cor}40'" onclick="acessarArea('${dept}', '${config.cor}')">
                    <div class="glow" style="background: ${config.cor};"></div>
                    <div class="dept-header">
                        <div class="dept-icon" style="color: ${config.cor};"><i class="fas ${config.icone}"></i></div>
                        <div class="dept-title" style="color: ${config.cor};">${dept}</div>
                    </div>
                    <p style="font-size: 13px; color: #888; margin: 0;">${config.desc}</p>
                    <div class="dept-action">
                        <span>Acessar Painel</span>
                        <i class="fas fa-arrow-right" style="color: ${config.cor};"></i>
                    </div>
                </div>
            `;
        }).join('');
    }

    function acessarArea(nomeDept, corDept) {
        localStorage.setItem('departamentoAtual', nomeDept);
        localStorage.setItem('corAtual', corDept);
        window.location.href = 'inicio.html';
    }

    // LÓGICA DO CALENDÁRIO
    function gerarCalendario() {
        const dataHoje = new Date();
        const ano = dataHoje.getFullYear();
        const mes = dataHoje.getMonth();
        
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        document.getElementById('mesAnoTitulo').innerText = `${nomesMeses[mes]} ${ano}`;

        const grid = document.getElementById('calendarioGrid');
        grid.innerHTML = `
            <div class="cal-day-name">Dom</div><div class="cal-day-name">Seg</div><div class="cal-day-name">Ter</div>
            <div class="cal-day-name">Qua</div><div class="cal-day-name">Qui</div><div class="cal-day-name">Sex</div><div class="cal-day-name">Sáb</div>
        `;

        const primeiroDiaMes = new Date(ano, mes, 1).getDay();
        const totalDiasMes = new Date(ano, mes + 1, 0).getDate();

        // Espaços em branco do início do mês
        for(let i = 0; i < primeiroDiaMes; i++) { grid.innerHTML += `<div class="cal-day other-month"></div>`; }

        // Mapeia eventos deste mês
        const eventosMes = escalasGlobais.filter(e => {
            if(!e.data) return false;
            const [y, m, d] = e.data.split('-');
            return parseInt(y) === ano && parseInt(m) - 1 === mes;
        });

        for(let dia = 1; dia <= totalDiasMes; dia++) {
            const divDia = document.createElement('div');
            divDia.className = 'cal-day';
            divDia.innerText = dia;
            if(dia === dataHoje.getDate()) divDia.classList.add('today');

            // Coloca a bolinha se tiver evento
            const evtsHoje = eventosMes.filter(e => parseInt(e.data.split('-')[2]) === dia);
            if(evtsHoje.length > 0) {
                const cor = DEPARTAMENTOS_CONFIG[evtsHoje[0].departamento || 'LOUVOR'].cor;
                divDia.innerHTML += `<div class="event-dot" style="background: ${cor}; box-shadow: 0 0 5px ${cor};"></div>`;
            }
            grid.appendChild(divDia);
        }
    }

    // MODAL E CADASTRO DE EVENTO
    function abrirModalEvento() {
        document.getElementById('modalNovoEvento').style.display = 'flex';
    }
    function fecharModal() {
        document.getElementById('modalNovoEvento').style.display = 'none';
        document.getElementById('evTitulo').value = '';
        document.getElementById('evData').value = '';
    }

    async function salvarEventoPastor() {
        const titulo = document.getElementById('evTitulo').value.trim();
        const dataStr = document.getElementById('evData').value;
        const dept = document.getElementById('evDept').value;

        if(!titulo || !dataStr) {
            alert('Preencha título e data para agendar o evento!');
            return;
        }

        const novaEscala = {
            titulo: titulo,
            data: dataStr,
            departamento: dept,
            equipe: "",
            repertorio: "",
            confirmacoes: "{}"
        };

        const btn = document.querySelector('.btn-salvar');
        btn.innerText = "Criando..."; btn.disabled = true;

        try {
            const res = await fetch('/api/escalas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novaEscala)
            });

            if (res.ok) {
                alert('Agenda criada! Os líderes já podem ver no painel.');
                fecharModal();
                inicializarDashboard(); // Recarrega para desenhar a bolinha no calendário
            } else {
                alert('Erro ao salvar no banco.');
            }
        } catch (e) {
            alert('Erro de conexão!');
        } finally {
            btn.innerHTML = "<i class='fas fa-check'></i> Criar Escala Base";
            btn.disabled = false;
        }
    }

    function sair() {
        localStorage.removeItem('usuario');
        localStorage.removeItem('token');
        localStorage.removeItem('departamentoAtual');
        localStorage.removeItem('corAtual');
        window.location.href = 'login.html'; 
    }

    // Start!
    inicializarDashboard();

</script>
</body>
</html>
