<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Sugestões</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           CSS ESPECÍFICO APENAS DESTA TELA
           ========================================= */

        /* Mantém o Laranja/Vermelho (Worship) APENAS nesta tela! */
        :root {
            --primary: #ff5722 !important;
        }

        .header-title { margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .header-title h2 { font-size: 28px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 1px;}
        .header-title p { color: var(--text-dim); margin-top: 5px; }

        /* CARD DE FORMULÁRIO */
        .form-card { background: #111; border: 1px solid #222; border-left: 4px solid var(--primary); padding: 25px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
        .form-card h3 { color: white; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 18px;}

        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        input { width: 100%; padding: 15px; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px; font-family: 'Urbanist', sans-serif; font-size: 15px; outline: none; transition: 0.3s;}
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.2); }

        .btn-submit { background: var(--primary); color: #000; font-weight: bold; font-family: 'Urbanist', sans-serif; font-size: 15px; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .btn-submit:hover { background: #e64a19; transform: translateY(-2px); }

        /* LISTA DE SUGESTÕES */
        .sugestao-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .sugestao-card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; position: relative;}
        .sugestao-card:hover { border-color: #333; transform: translateY(-3px); }

        .sugestao-info h4 { font-size: 18px; color: white; margin-bottom: 5px; padding-right: 30px;}
        .sugestao-info p { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 5px;}

        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .votos-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 87, 34, 0.1); color: var(--primary); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        .btn-votar { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 6px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s; display: flex; align-items: center; gap: 5px;}
        .btn-votar:hover { background: var(--primary); color: black; }

        .btn-excluir { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; opacity: 0.5; transition: 0.2s; }
        .btn-excluir:hover { opacity: 1; transform: scale(1.1); }

        .admin-only, .boss-only { display: none !important; }
    </style>
</head>
<body>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

<header class="mobile-header">
    <button class="hamburger-btn" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
    </button>
    <h2>Be One <span class="highlight">Tech</span></h2>
</header>

<aside class="sidebar" id="sidebar">
    <h2>Be One <span class="highlight">Tech</span></h2>
    <a href="inicio.html"><i class="fas fa-home"></i> Início</a>
    <a href="dashboard.html" class="active"><i class="fas fa-lightbulb"></i> Sugestões</a>
    <a href="louvores.html"><i class="fas fa-music"></i> Repertório</a>
    <a href="membros.html"><i class="fas fa-users"></i> Membros</a>
    <a href="escalas.html"><i class="fas fa-calendar-alt"></i> Escalas</a>
    <a href="perfil.html"><i class="fas fa-user-circle"></i> Meu Perfil</a>
    <a href="usuarios.html" id="linkAdmin" class="admin-only"><i class="fas fa-user-shield"></i> Gestão de Usuários</a>
    <a href="#" onclick="sair()" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</a>
</aside>

<main class="main-content">

    <div class="header-title">
        <h2>Radar de Louvores</h2>
        <p>Qual música não pode faltar no nosso próximo culto? Deixe sua sugestão abaixo.</p>
    </div>

    <div class="form-card">
        <h3><i class="fas fa-headphones" style="color: var(--primary);"></i> Enviar Nova Sugestão</h3>

        <div class="input-group">
            <input type="text" id="titulo" placeholder="Nome da Música (Ex: Maranata)">
            <input type="text" id="ministro" placeholder="Ministro / Banda (Ex: Ministério Zoe)">
        </div>

        <button class="btn-submit" onclick="salvarMusica()">
            <i class="fas fa-paper-plane"></i> Enviar Nova Sugestão
        </button>
    </div>

    <h3 style="color: white; margin-bottom: 20px; font-size: 20px;"><i class="fas fa-fire" style="color: var(--primary);"></i> Mais Pedidas pela Equipe</h3>

    <div id="listaMusicas" class="sugestao-grid"></div>

</main>

<script>
    const user = JSON.parse(localStorage.getItem('usuario')) || {nome: 'Visitante', cargo: 'MEMBRO'};
    const cargoUser = String(user.cargo).toUpperCase().trim();
    const isChefia = ['ADMIN', 'DEV', 'LIDER', 'PASTOR'].includes(cargoUser);

    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
    }

    function ajustarAcessos() {
        if (['ADMIN', 'DEV'].includes(cargoUser)) {
            const linkAdmin = document.getElementById('linkAdmin');
            if (linkAdmin) { linkAdmin.classList.remove('admin-only'); linkAdmin.style.display = 'flex'; }
        }
    }

    async function carregar() {
        try {
            const res = await fetch('/api/musicas', { cache: 'no-store' });
            if (!res.ok) throw new Error("Erro ao carregar");
            const musicas = await res.json();

            const lista = document.getElementById('listaMusicas');
            lista.innerHTML = '';

            if (musicas.length === 0) {
                lista.innerHTML = '<p style="color: var(--text-dim); grid-column: 1 / -1;">Nenhuma sugestão enviada ainda. Seja o primeiro!</p>';
                return;
            }

            // Ordena pelo maior número de votos
            musicas.sort((a, b) => (b.quantidadeSugestoes || 1) - (a.quantidadeSugestoes || 1));

            musicas.forEach(m => {
                const btnLixeira = isChefia ? `<button class="btn-excluir" onclick="excluirMusica(${m.id})" title="Apagar Sugestão"><i class="fas fa-trash"></i></button>` : '';
                
                // Tratamento para evitar que aspas quebrem o JS no onclick
                const tituloSeguro = m.titulo.replace(/'/g, "\\'");
                const ministroSeguro = (m.ministro || '').replace(/'/g, "\\'");
                const tituloMinusculo = m.titulo.toLowerCase();

                lista.innerHTML += `
                    <div class="sugestao-card">
                        ${btnLixeira}
                        <div class="sugestao-info">
                            <h4>${m.titulo}</h4>
                            <p><i class="fas fa-microphone-alt"></i> ${m.ministro || 'Banda Desconhecida'}</p>
                        </div>
                        <div class="card-actions">
                            <div class="votos-badge">
                                <i class="fas fa-fire"></i> ${m.quantidadeSugestoes || 1} Voto(s)
                            </div>
                            <button class="btn-votar" onclick="votarPeloCard('${tituloMinusculo}', '${tituloSeguro}', '${ministroSeguro}')">
                                <i class="fas fa-arrow-up"></i> Votar
                            </button>
                        </div>
                    </div>`;
            });
        } catch (error) {
            console.error(error);
        }
    }

    // Função para registrar nova sugestão pela barra de pesquisa
    async function salvarMusica() {
        const inputTitulo = document.getElementById('titulo').value.trim();
        const inputMinistro = document.getElementById('ministro').value.trim();

        if (inputTitulo === '') {
            alert("Ei, você esqueceu de digitar o nome da música!");
            return;
        }

        enviarVotoBackend(inputTitulo, inputMinistro);
    }

    // Função engatilhada pelo botão de votar dentro do card
    function votarPeloCard(tituloMinusculo, tituloOriginal, ministroOriginal) {
        enviarVotoBackend(tituloOriginal, ministroOriginal);
    }

    // Função central que comunica com o Back-end
    async function enviarVotoBackend(titulo, ministro) {
        let meusVotos = JSON.parse(localStorage.getItem('votosBeOneTech') || '[]');
        const tituloMinusculo = titulo.toLowerCase();

        // Trava para a pessoa não votar duas vezes na mesma música no mesmo celular/PC
        if (meusVotos.includes(tituloMinusculo)) {
            alert("Você já votou neste louvor! Apoie as outras opções da lista.");
            return;
        }

        const m = {
            titulo: titulo,
            ministro: ministro || 'Não informado'
        };

        try {
            await fetch('/api/musicas', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(m)
            });

            // Salva no celular que a pessoa já votou nessa música
            meusVotos.push(tituloMinusculo);
            localStorage.setItem('votosBeOneTech', JSON.stringify(meusVotos));

            document.getElementById('titulo').value = '';
            document.getElementById('ministro').value = '';
            
            await carregar(); // Recarrega a tela para mostrar o voto subindo!

        } catch (e) {
            alert("Erro ao conectar com o servidor. Tente novamente.");
        }
    }

    async function excluirMusica(id) {
        if(confirm("Tem certeza que deseja remover esta sugestão do radar?")) {
            try {
                await fetch(`/api/musicas/${id}`, { method: 'DELETE' });
                carregar();
            } catch(e) {
                alert("Erro ao apagar.");
            }
        }
    }

    function sair() {
        localStorage.removeItem('usuario');
        window.location.href = 'index.html';
    }

    ajustarAcessos();
    carregar();
</script>
</body>
</html>
