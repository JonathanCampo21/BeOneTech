<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Ranking de Sugestões</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>

    <style>
        /* CSS ESPECÍFICO DESTA TELA */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }

        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); overflow-x: auto; border-left: 4px solid var(--primary); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 500px; }
        th, td { padding: 15px 12px; text-align: left; border-bottom: 1px solid #222; }
        th { color: var(--text-dim); font-size: 13px; text-transform: uppercase; }

        .btn-acao { background: transparent; border: 1px solid #333; color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Urbanist', sans-serif; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .btn-acao:hover { background: #1a1a1a; border-color: var(--primary); color: var(--primary); }

        .btn-zerar { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: 'Urbanist', sans-serif; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .btn-zerar:hover { background: #ef4444; color: white; }

        .admin-only, .boss-only { display: none !important; }
    </style>
</head>
<body>

<div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

<header class="mobile-header">
    <button class="hamburger-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    <h2>Be One <span class="highlight">Tech</span></h2>
</header>

<aside class="sidebar" id="sidebar">
    <h2>Be One <span class="highlight">Tech</span></h2>
    <a href="inicio.html"><i class="fas fa-home"></i> Início</a>
    <a href="dashboard.html" class="active"><i class="fas fa-lightbulb"></i> Sugestões</a>
    <a href="louvores.html"><i class="fas fa-music"></i> Repertório</a>
    <a href="membros.html"><i class="fas fa-users"></i> Membros</a>
    <a href="escalas.html"><i class="fas fa-calendar-alt"></i> Escalas</a>
    <a href="usuarios.html" id="linkAdmin" class="admin-only"><i class="fas fa-user-shield"></i> Gestão de Usuários</a>
    <a href="#" onclick="sair()" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Sair</a>
</aside>

<main class="main-content">
    <div class="header">
        <div>
            <h1 style="margin: 0;">Gestão de Louvores</h1>
            <p style="margin: 5px 0 0 0; color: var(--text-dim);">Acompanhe o ranking de sugestões da comunidade.</p>
        </div>
        <div style="display: flex; gap: 10px;" id="areaBotoesBoss" class="boss-only">
            <button onclick="window.open('index.html', '_blank')" class="btn-acao">
                <i class="fas fa-external-link-alt"></i> Tela Pública
            </button>
            <button onclick="zerarRanking()" id="btnZerar" class="btn-zerar admin-only">
                <i class="fas fa-trash-alt"></i> Zerar Ranking
            </button>
        </div>
    </div>

    <div class="card">
        <h2 style="margin-top: 0; margin-bottom: 20px;"><i class="fas fa-trophy highlight"></i> Ranking Atual</h2>
        <table>
            <thead>
            <tr>
                <th>Posição</th>
                <th>Louvor</th>
                <th>Votos</th>
                <th style="text-align: right;" class="boss-only">Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaRanking"></tbody>
        </table>
    </div>
</main>

<script>
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    const user = JSON.parse(localStorage.getItem('usuario')) || {cargo: 'MEMBRO'};
    const cargoUser = String(user.cargo).toUpperCase().trim();

    function ajustarAcessos() {
        if (cargoUser === 'ADMIN' || cargoUser === 'DEV') {
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.remove('admin-only');
                el.style.display = el.tagName === 'A' ? 'flex' : 'inline-block';
            });
        }
        if (['ADMIN', 'DEV', 'LIDER', 'PASTOR'].includes(cargoUser)) {
            document.querySelectorAll('.boss-only').forEach(el => {
                el.classList.remove('boss-only');
                el.style.display = el.tagName === 'TH' || el.tagName === 'TD' ? 'table-cell' : 'flex';
            });
        }
    }

    async function carregarRanking() {
        try {
            const resposta = await fetch('/api/musicas/ranking', { cache: 'no-store' });
            const musicas = await resposta.json();
            const tabela = document.getElementById('tabelaRanking');

            tabela.innerHTML = musicas.length === 0
                ? '<tr><td colspan="4" style="text-align: center; color: var(--text-dim); padding: 20px;">Nenhuma música sugerida ainda.</td></tr>'
                : musicas.map((m, i) => `
                    <tr>
                        <td><strong style="color: var(--primary); font-size: 18px;">${i + 1}º</strong></td>
                        <td><strong>${m.titulo}</strong></td>
                        <td><span style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 4px 8px; border-radius: 4px; font-weight: bold;">${m.quantidadeSugestoes || 0} votos</span></td>
                        <td style="text-align: right;" class="boss-only">
                            <button onclick="excluirSugestao(${m.id})" style="background:none; border:1px solid #ef4444; color:#ef4444; padding:5px 10px; border-radius:5px; cursor:pointer; transition: 0.2s;"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');

            ajustarAcessos();
        } catch (error) { console.error("Erro ao carregar ranking:", error); }
    }

    async function zerarRanking() {
        if(confirm("ATENÇÃO: Deseja zerar todos os votos e apagar a lista?")) {
            await fetch('/api/musicas/ranking/zerar', { method: 'DELETE' });
            carregarRanking();
        }
    }

    async function excluirSugestao(id) {
        if(confirm("Remover esta sugestão da lista?")) {
            await fetch(`/api/musicas/${id}`, { method: 'DELETE' });
            carregarRanking();
        }
    }

    ajustarAcessos();
    carregarRanking();
</script>
</body>
</html>
