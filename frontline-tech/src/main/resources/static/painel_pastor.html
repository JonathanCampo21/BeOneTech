<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Visão Geral</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* === O SEU CSS ORIGINAL INTACTO === */
        :root { --primary: #10b981; --text-dim: #a0a0a0; }
        body { background-color: #050505; color: #fff; font-family: 'Urbanist', sans-serif; margin: 0; padding: 20px; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 24px; display: flex; align-items: center; gap: 10px; }
        .header h1 i { color: var(--primary); }
        .btn-sair { background: none; border: 1px solid #ef4444; color: #ef4444; padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-family: 'Urbanist'; font-weight: bold;}
        .btn-sair:hover { background: rgba(239, 68, 68, 0.1); }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .dept-card { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .dept-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .dept-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .dept-icon { font-size: 24px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,0.05); }
        .dept-title { font-weight: bold; font-size: 18px; text-transform: uppercase; }
        .dept-action { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #222; padding-top: 15px; margin-top: 10px; }
        .glow { position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; border-radius: 50%; filter: blur(40px); opacity: 0.3; }

        /* === NOVAS ADIÇÕES (VIBE DO VÍDEO E NOVOS PAINÉIS) === */
        
        /* Luz Ambiente Vazada (Light Leak) */
        .ambient-glow { position: fixed; top: -20%; left: -10%; width: 60vw; height: 60vh; background: radial-gradient(circle, rgba(162, 255, 0, 0.05) 0%, transparent 60%); filter: blur(90px); z-index: -1; pointer-events: none; }
        .ambient-glow-2 { position: fixed; bottom: -20%; right: -10%; width: 60vw; height: 60vh; background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 60%); filter: blur(90px); z-index: -1; pointer-events: none; }

        /* Container Principal dividido em Esquerda e Direita */
        .main-layout { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

        /* KPIs Superiores (Linha de 3 cards) */
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        @media (max-width: 600px) { .kpi-grid { grid-template-columns: 1fr; } }
        .kpi-card { background: #111; border: 1px solid #222; padding: 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .kpi-icon { width: 45px; height: 45px; border-radius: 10px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .kpi-text h4 { margin: 0; font-size: 22px; font-weight: 900; color: #fff; }
        .kpi-text p { margin: 0; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; margin-top: 2px;}

        /* Bloco Lateral Direto (Calendário e Alertas) */
        .side-panel { background: #111; border: 1px solid #222; border-radius: 16px; padding: 25px; height: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cal-header h2 { margin: 0; font-size: 20px; color: #fff; }
        .btn-add { background: #10b981; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: 'Urbanist'; font-size: 12px; transition: 0.2s;}
        .btn-add:hover { background: #059669; transform: scale(1.05); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
        .cal-day-name { text-align: center; font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; padding-bottom: 5px;}
        .cal-day { background: #0a0a0a; border: 1px solid transparent; border-radius: 8px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #fff; position: relative; cursor: pointer; transition: 0.2s;}
        .cal-day:hover { border-color: #333; background: #151515; }
        .cal-day.today { border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.05);}
        .cal-day.other-month { opacity: 0.2; pointer-events: none;}
        .event-dot { width: 5px; height: 5px; border-radius: 50%; position: absolute; bottom: 4px; }

        .alert-box { background: rgba(239, 68, 68, 0.05); border: 1px dashed rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 15px; margin-top: 20px;}
        .alert-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0;}
        .alert-item:last-child { border-bottom: none; padding-bottom: 0;}
        .alert-name { font-size: 13px; color: #fff; font-weight: bold;}
        .alert-reason { font-size: 11px; color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 3px 6px; border-radius: 8px;}

        /* Modal para Cadastrar Evento */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: #111; border: 1px solid #333; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; font-weight: bold;}
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0a0a0a; border: 1px solid #222; color: white; border-radius: 8px; font-family: 'Urbanist'; outline: none; box-sizing: border-box;}
        .form-group input:focus, .form-group select:focus { border-color: #10b981; }
        .btn-salvar { width: 100%; padding: 15px; background: #10b981; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Urbanist'; margin-top: 10px; transition: 0.2s;}
        .btn-salvar:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="header">
        <h1><i class="fas fa-chart-pie"></i> Ministério Be One <span style="color: gray; font-size: 14px; margin-left: 10px;" id="nomePastor"></span></h1>
        <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>

    <div class="main-layout">
        
        <div class="left-col">
            
            <h2 style="font-size: 16px; text-transform: uppercase; color: #ccc; margin-top: 0;">Resumo Operacional</h2>
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-icon" style="color: #10b981;"><i class="fas fa-users"></i></div>
                    <div class="kpi-text"><h4 id="kpiTotal">0</h4><p>Total de Membros</p></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="color: #3b82f6;"><i class="fas fa-crown"></i></div>
                    <div class="kpi-text"><h4 id="kpiLideres">0</h4><p>Líderes de Área</p></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon" style="color: #ef4444;"><i class="fas fa-user-injured"></i></div>
                    <div class="kpi-text"><h4 id="kpiFaltas">0</h4><p>Ausências (Mês)</p></div>
                </div>
            </div>

            <h2 style="font-size: 16px; text-transform: uppercase; color: #ccc; margin-top: 30px;">Gestão de Áreas</h2>
            <p style="color: var(--text-dim); margin-bottom: 25px; font-size: 14px;">Selecione o ministério abaixo para visualizar as escalas e gerenciar a equipe.</p>
            
            <div class="dashboard-grid" id="gridDepartamentos">
            </div>

        </div>

        <div class="right-col">
            <div class="side-panel">
                <div class="cal-header">
                    <h2 id="mesAnoTitulo">Mês 2024</h2>
                    <button class="btn-add" onclick="abrirModalEvento()"><i class="fas fa-plus"></i> Novo Evento</button>
                </div>

                <div class="cal-grid" id="calendarioGrid">
                    </div>

                <div class="alert-box">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: #ef4444; font-weight: bold; font-size: 13px; text-transform: uppercase;">
                        <i class="fas fa-exclamation-triangle"></i> Atenção Pastoral
                    </div>
                    <div id="listaAlertas">
                        <p style="color: #888; font-size: 12px; margin: 0;">Buscando assiduidade...</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="modalNovoEvento" onclick="if(event.target === this) fecharModal()">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0; color: #10b981; font-size: 18px;"><i class="fas fa-calendar-plus"></i> Agendar Culto</h3>
                <i class="fas fa-times" style="cursor: pointer; color: #888;" onclick="fecharModal()"></i>
            </div>
            <div class="form-group">
                <label>Título do Culto / Evento</label>
                <input type="text" id="evTitulo" placeholder="Ex: Culto de Celebração">
            </div>
            <div class="form-group">
                <label>Data</label>
                <input type="date" id="evData">
            </div>
            <div class="form-group">
                <label>Vincular a qual Ministério?</label>
                <select id="evDept">
                    <option value="LOUVOR">LOUVOR</option>
                    <option value="MIDIA">MÍDIA</option>
                    <option value="SALT">SALT</option>
                    <option value="27+">27+</option>
                    <option value="JOIN">JOIN</option>
                    <option value="KIDS">KIDS</option>
                </select>
            </div>
            <button class="btn-salvar" onclick="salvarEventoPastor()"><i class="fas fa-check"></i> Criar Escala Base</button>
        </div>
    </div>

<script>
    const userLogado = JSON.parse(localStorage.getItem('usuario')) || {};
    if(userLogado.cargo !== 'PASTOR' && userLogado.cargo !== 'DEV') {
        window.location.href = 'login.html'; 
    }
    
    // Coloca o "Pr. " antes do nome
    document.getElementById('nomePastor').innerText = "| Pr. " + (userLogado.nome ? userLogado.nome.split(' ')[0] : 'Pastor');

    const DEPARTAMENTOS_CONFIG = {
        "LOUVOR": { cor: "#FF3300", icone: "fa-music", desc: "Escalas, Repertórios e Sugestões" },
        "MIDIA": { cor: "#190B28", icone: "fa-camera", desc: "Escalas de Transmissão e Foto" },
        "SALT": { cor: "#121831", icone: "fa-users", desc: "Escalas e Gestão de Membros" },
        "27+": { cor: "#10251A", icone: "fa-plus-circle", desc: "Escalas e Gestão de Membros" },
        "JOIN": { cor: "#2F3C64", icone: "fa-handshake", desc: "Escalas e Recepção" },
        "KIDS": { cor: "#FDD835", icone: "fa-child", desc: "Escalas do Ministério Infantil" }
    };

    let escalasGlobais = [];

    async function inicializarDashboard() {
        // 1. RENDERIZA OS SEUS CARDS EXATAMENTE COMO ERAM
        renderizarCardsOriginais();

        try {
            // 2. BUSCA OS DADOS DE INTELIGÊNCIA
            const [resMembros, resEscalas, resFaltas] = await Promise.all([
                fetch('/api/membros'), fetch('/api/escalas'), fetch('/api/indisponibilidade')
            ]);

            let membros = []; let faltas = [];
            if(resMembros.ok) membros = await resMembros.json();
            if(resEscalas.ok) escalasGlobais = await resEscalas.json();
            if(resFaltas.ok) faltas = await resFaltas.json();

            // 3. PREENCHE OS KPIs
            document.getElementById('kpiTotal').innerText = membros.length;
            document.getElementById('kpiLideres').innerText = membros.filter(m => String(m.cargo).toUpperCase() === 'LIDER' || String(m.cargo).toUpperCase() === 'PASTOR').length;
            
            const mesAtual = new Date().getMonth();
            const anoAtual = new Date().getFullYear();
            const faltasMes = faltas.filter(f => f.data && new Date(f.data).getMonth() === mesAtual && new Date(f.data).getFullYear() === anoAtual);
            document.getElementById('kpiFaltas').innerText = faltasMes.length;

            // 4. PREENCHE O RADAR PASTORAL
            const contagemFaltas = {};
            faltasMes.forEach(f => { contagemFaltas[f.nomeMembro.trim()] = (contagemFaltas[f.nomeMembro.trim()] || 0) + 1; });
            
            let htmlAlertas = '';
            Object.keys(contagemFaltas).forEach(nome => {
                if(contagemFaltas[nome] >= 2) {
                    htmlAlertas += `<div class="alert-item"><span class="alert-name">${nome}</span><span class="alert-reason">${contagemFaltas[nome]} Ausências</span></div>`;
                }
            });
            document.getElementById('listaAlertas').innerHTML = htmlAlertas || '<p style="color: #888; font-size: 12px; margin: 0;">Equipe assídua. Nenhum alerta.</p>';

            // 5. DESENHA O CALENDÁRIO
            gerarCalendario();

        } catch (e) {
            console.error("Erro na carga de dados", e);
        }
    }

    // A FUNÇÃO QUE VOCÊ CRIOU!
    function renderizarCardsOriginais() {
        const grid = document.getElementById('gridDepartamentos');
        const departamentos = Object.keys(DEPARTAMENTOS_CONFIG);

        grid.innerHTML = departamentos.map(dept => {
            const config = DEPARTAMENTOS_CONFIG[dept];
            return `
                <div class="dept-card" style="border-color: ${config.cor}40;" onmouseover="this.style.borderColor='${config.cor}'" onmouseout="this.style.borderColor='${config.cor}40'" onclick="acessarArea('${dept}', '${config.cor}')">
                    <div class="glow" style="background: ${config.cor};"></div>
                    <div class="dept-header">
                        <div class="dept-icon" style="color: ${config.cor};"><i class="fas ${config.icone}"></i></div>
                        <div class="dept-title" style="color: ${config.cor};">${dept}</div>
                    </div>
                    <p style="font-size: 13px; color: #888; margin: 0;">${config.desc}</p>
                    <div class="dept-action">
                        <span>Acessar Painel</span>
                        <i class="fas fa-arrow-right" style="color: ${config.cor};"></i>
                    </div>
                </div>
            `;
        }).join('');
    }

    function acessarArea(nomeDept, corDept) {
        localStorage.setItem('departamentoAtual', nomeDept);
        localStorage.setItem('corAtual', corDept);
        window.location.href = 'inicio.html';
    }

    // MOTOR DO CALENDÁRIO
    function gerarCalendario() {
        const dataHoje = new Date();
        const ano = dataHoje.getFullYear();
        const mes = dataHoje.getMonth();
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        document.getElementById('mesAnoTitulo').innerText = `${nomesMeses[mes]} ${ano}`;

        const grid = document.getElementById('calendarioGrid');
        grid.innerHTML = `
            <div class="cal-day-name">Dom</div><div class="cal-day-name">Seg</div><div class="cal-day-name">Ter</div>
            <div class="cal-day-name">Qua</div><div class="cal-day-name">Qui</div><div class="cal-day-name">Sex</div><div class="cal-day-name">Sáb</div>
        `;

        const primeiroDiaMes = new Date(ano, mes, 1).getDay();
        const totalDiasMes = new Date(ano, mes + 1, 0).getDate();

        for(let i = 0; i < primeiroDiaMes; i++) { grid.innerHTML += `<div class="cal-day other-month"></div>`; }

        const eventosMes = escalasGlobais.filter(e => {
            if(!e.data) return false;
            const [y, m, d] = e.data.split('-');
            return parseInt(y) === ano && parseInt(m) - 1 === mes;
        });

        for(let dia = 1; dia <= totalDiasMes; dia++) {
            const divDia = document.createElement('div');
            divDia.className = 'cal-day';
            divDia.innerText = dia;
            if(dia === dataHoje.getDate()) divDia.classList.add('today');

            const evtsHoje = eventosMes.filter(e => parseInt(e.data.split('-')[2]) === dia);
            if(evtsHoje.length > 0) {
                const cor = DEPARTAMENTOS_CONFIG[evtsHoje[0].departamento || 'LOUVOR'].cor;
                divDia.innerHTML += `<div class="event-dot" style="background: ${cor}; box-shadow: 0 0 5px ${cor};"></div>`;
            }
            grid.appendChild(divDia);
        }
    }

    // CONTROLE DO MODAL DE AGENDA
    function abrirModalEvento() { document.getElementById('modalNovoEvento').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modalNovoEvento').style.display = 'none'; document.getElementById('evTitulo').value = ''; document.getElementById('evData').value = ''; }

    async function salvarEventoPastor() {
        const titulo = document.getElementById('evTitulo').value.trim();
        const dataStr = document.getElementById('evData').value;
        const dept = document.getElementById('evDept').value;

        if(!titulo || !dataStr) { alert('Preencha título e data para agendar o evento!'); return; }

        const novaEscala = { titulo: titulo, data: dataStr, departamento: dept, equipe: "", repertorio: "", confirmacoes: "{}" };
        const btn = document.querySelector('.btn-salvar');
        btn.innerText = "Criando..."; btn.disabled = true;

        try {
            const res = await fetch('/api/escalas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(novaEscala) });
            if (res.ok) { alert('Agenda criada! Os líderes já podem ver no painel.'); fecharModal(); inicializarDashboard(); } 
            else { alert('Erro ao salvar no banco.'); }
        } catch (e) { alert('Erro de conexão!'); } 
        finally { btn.innerHTML = "<i class='fas fa-check'></i> Criar Escala Base"; btn.disabled = false; }
    }

    function sair() {
        localStorage.removeItem('usuario'); localStorage.removeItem('token');
        localStorage.removeItem('departamentoAtual'); localStorage.removeItem('corAtual');
        window.location.href = 'login.html'; 
    }

    inicializarDashboard();
</script>
</body>
</html>
