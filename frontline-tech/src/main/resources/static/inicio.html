<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be One Tech - Início</title>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>

    <style>
        /* =========================================
           CSS ESPECÍFICO APENAS DESTA TELA (INÍCIO)
           ========================================= */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 30px; }
        .stat-card { background: #111; border: 1px solid #333; padding: 25px; border-radius: 12px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; }
        .stat-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .stat-icon { font-size: 35px; color: var(--primary); background: rgba(16, 185, 129, 0.1); padding: 15px; border-radius: 12px; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
        .stat-info h3 { font-size: 32px; margin: 0; color: white; }
        .stat-info p { color: var(--text-dim); margin: 0; font-size: 12px; text-transform: uppercase; font-weight: bold; margin-top: 5px; }

        .welcome-box { background: linear-gradient(135deg, #111 0%, #0a0a0a 100%); border: 1px solid #333; padding: 40px; border-radius: 15px; margin-bottom: 30px; border-left: 5px solid var(--primary); }

        .escala-mini-card { background: #111; border: 1px solid #222; border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: 0.3s; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .escala-mini-card:hover { background: #1a1a1a; transform: translateX(5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .escala-date { text-align: center; line-height: 1.1; min-width: 60px; }
        .escala-date .day { font-size: 28px; font-weight: 900; color: var(--primary); }
        .escala-date .month { font-size: 13px; color: var(--text-dim); text-transform: uppercase; font-weight: bold; }
        .escala-info h4 { margin: 0; font-size: 18px; color: white; font-weight: bold; }
        .escala-info p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-dim); }

        /* MODAIS GERAIS (Efeito Gênio) */
        .genie-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1001;}
        .genie-overlay.active { opacity: 1; pointer-events: all; }

        .genie-modal { position: fixed; background: #111; border: 1px solid #333; border-radius: 20px; padding: 0; width: 90%; max-width: 600px; height: auto; max-height: 90vh; overflow-y: auto; transform: scale(0); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease; z-index: 1002;}
        .genie-modal.active { transform: scale(1); opacity: 1; }

        .genie-header { background: #1a1a1a; padding: 30px; border-bottom: 2px solid var(--primary); border-radius: 20px 20px 0 0; text-align: center; }
        .genie-title { font-size: 28px; font-weight: 900; margin-bottom: 5px; color: white; }
        .genie-subtitle { color: var(--primary); font-size: 16px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }

        .genie-content { padding: 30px; }
        .detalhe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;}
        .detalhe-box { background: #0a0a0a; border: 1px solid #222; border-radius: 12px; padding: 20px; }
        .detalhe-box h5 { color: var(--primary); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; border-bottom: 1px solid #222; padding-bottom: 5px;}
        .detalhe-box p { font-size: 14px; line-height: 1.6; color: #ddd; margin: 0; }

        .btn-close-genie { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 16px; transition: 0.3s;}
        .btn-close-genie:hover { background: #ef4444; }

        .rsvp-area { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 20px; text-align: center; }
        .rsvp-status { font-size: 12px; text-transform: uppercase; font-weight: bold; margin-bottom: 15px; color: var(--text-dim); }
        .rsvp-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn-rsvp { padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; flex: 1; transition: 0.2s; font-family: 'Urbanist', sans-serif;}
        .btn-rsvp.yes { background: #10b981; color: #000; }
        .btn-rsvp.yes:hover { background: #059669; transform: translateY(-2px);}
        .btn-rsvp.no { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
        .btn-rsvp.no:hover { background: #ef4444; color: #fff; transform: translateY(-2px);}

        /* ITENS DE MÚSICA COM FOTO DENTRO DA ESCALA */
        .escala-musica-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #1a1a1a; border: 1px solid #222; border-radius: 8px; margin-bottom: 8px; transition: 0.2s; }
        .escala-musica-item.clickable { cursor: pointer; }
        .escala-musica-item.clickable:hover { border-color: var(--primary); transform: translateX(5px); }
        .escala-musica-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .escala-musica-info { flex: 1; }
        .escala-musica-info h6 { margin: 0; font-size: 14px; color: white; display: flex; justify-content: space-between; align-items: center;}
        .escala-musica-info p { margin: 2px 0 0 0; font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;}

        /* CSS ESPECÍFICO DO MODAL DO LOUVOR */
        .louvor-header-img { width: 100%; height: 250px; object-fit: cover; border-radius: 20px 20px 0 0; border-bottom: 2px solid var(--primary); }
        .louvor-info-box { display: flex; gap: 20px; margin-bottom: 30px; }
        .info-item { background: #1a1a1a; padding: 15px 20px; border-radius: 12px; border: 1px solid #222; text-align: center; flex: 1; }
        .info-item span { display: block; font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: bold;}
        .info-item strong { font-size: 24px; color: var(--primary); }
        .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-link { background: #222; color: white; padding: 15px; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; border: 1px solid #333; display: block;}
        .btn-link:hover { background: var(--primary); color: black; border-color: var(--primary); transform: translateY(-3px); }
        .btn-youtube:hover { background: #ef4444; color: white; border-color: #ef4444; }
        .btn-link.disabled { opacity: 0.3; pointer-events: none; }

        .admin-only, .boss-only { display: none !important; }

        /* ESTILO DO USUÁRIO NA SIDEBAR (CLICÁVEL) */
        .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border: 1px solid transparent; border-bottom: 1px solid #222; margin-bottom: 15px; cursor: pointer; transition: 0.3s; border-radius: 8px;}
